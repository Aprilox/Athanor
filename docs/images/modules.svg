<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" width="1200" height="700" font-family="Inter, Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#8fa3b8"/></marker>
    <marker id="fa" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L10 5 L0 10 Z" fill="#3fc6a5"/></marker>
  </defs>
  <style>
    .t { fill: #e8eef5; font-size: 17px; font-weight: 600; }
    .s { fill: #9fb0c2; font-size: 13.5px; }
    .k { fill: #3fc6a5; font-size: 12.5px; font-weight: 600; letter-spacing: 1.2px; }
    .r { fill: #f2a35e; font-size: 12.5px; font-weight: 600; letter-spacing: 1.2px; }
    .box { fill: #1c2633; stroke: #2e3c4d; stroke-width: 1.5; }
    .acc { fill: #17352f; stroke: #3fc6a5; stroke-width: 1.5; }
    .vault { fill: #2b2417; stroke: #f2a35e; stroke-width: 1.5; }
    .ln { stroke: #8fa3b8; stroke-width: 1.8; fill: none; marker-end: url(#fl); }
    .la { stroke: #3fc6a5; stroke-width: 2; fill: none; marker-end: url(#fa); }
    .both { marker-start: url(#fl); }
    .bota { marker-start: url(#fa); }
    .no { stroke: #e0636b; stroke-width: 2; fill: none; stroke-dasharray: 6 5; }
    .not { fill: #e0636b; font-size: 13px; font-weight: 600; }
  </style>
  <rect width="1200" height="700" rx="24" fill="#111821"/>
  <rect class="box" x="40" y="40" width="340" height="120" rx="14"/>
  <text class="k" x="60" y="70">YOU</text>
  <text class="t" x="60" y="97">Home page, any device</text>
  <text class="s" x="60" y="121">this PC, or your phone and another</text>
  <text class="s" x="60" y="141">computer through the tunnel</text>
  <rect class="box" x="430" y="40" width="340" height="120" rx="14"/>
  <text class="k" x="450" y="70">MCP CLIENTS</text>
  <text class="t" x="450" y="97">Claude Desktop, Claude Code</text>
  <text class="s" x="450" y="121">drive Athanor with a scope:</text>
  <text class="s" x="450" y="141">these projects, these tools</text>
  <rect class="box" x="820" y="40" width="340" height="120" rx="14"/>
  <text class="k" x="840" y="70">REMOTE ATHANORS</text>
  <text class="t" x="840" y="97">A laptop, a VPS</text>
  <text class="s" x="840" y="121">another Athanor joins yours</text>
  <text class="s" x="840" y="141">and offers its modules</text>
  <path class="la bota" d="M210 166 V226"/>
  <path class="la bota" d="M600 166 V226"/>
  <path class="la bota" d="M990 166 V226"/>
  <text class="s" x="1000" y="203">paired: a code + your yes</text>
  <rect class="acc" x="40" y="232" width="1120" height="170" rx="14"/>
  <text class="k" x="60" y="262">THE HUB</text>
  <text class="t" x="60" y="289">Checks every link, logs it, asks you</text>
  <text class="s" x="60" y="313">home assistant, tiles, Projects page, one bell for every alert</text>
  <text class="s" x="60" y="333">one sentence, a card to check, Launch; each project has its deployment</text>
  <text class="s" x="60" y="353">audit log with a SHA-256 chain; prod and destructive actions wait</text>
  <text class="s" x="60" y="373">for your accord and your password</text>
  <rect class="vault" x="830" y="250" width="310" height="134" rx="14"/>
  <text class="r" x="850" y="280">THE VAULT · IN THE HUB</text>
  <text class="s" x="850" y="306">AES-256-GCM on disk</text>
  <text class="s" x="850" y="326">code keys: granted per project</text>
  <text class="s" x="850" y="346">and nothing else of the vault</text>
  <text class="s" x="850" y="366">infra keys: never leave Athanor</text>
  <rect class="box" x="40" y="482" width="360" height="150" rx="14"/>
  <text class="k" x="60" y="512">STUDIO</text>
  <text class="t" x="60" y="539">Projects Claude builds</text>
  <text class="s" x="60" y="563">one milestone per cycle,</text>
  <text class="s" x="60" y="583">in a sandbox</text>
  <text class="s" x="60" y="603">modules/dev/</text>
  <path class="ln both" d="M220 476 V408"/>
  <rect class="box" x="420" y="482" width="360" height="150" rx="14"/>
  <text class="k" x="440" y="512">SERVERS</text>
  <text class="t" x="440" y="539">VPS, DNS, deployments</text>
  <text class="s" x="440" y="563">plans you accept, rollback,</text>
  <text class="s" x="440" y="583">health checks</text>
  <text class="s" x="440" y="603">modules/servers/</text>
  <path class="ln both" d="M600 476 V408"/>
  <rect class="box" x="800" y="482" width="360" height="150" rx="14"/>
  <text class="k" x="820" y="512">E-MAIL</text>
  <text class="t" x="820" y="539">SMTP for your apps</text>
  <text class="s" x="820" y="563">test in one click, settings</text>
  <text class="s" x="820" y="583">given to a project</text>
  <text class="s" x="820" y="603">modules/email/</text>
  <path class="ln both" d="M980 476 V408"/>
  <path class="no" d="M400 560 H420"/>
  <path class="no" d="M780 560 H800"/>
  <text class="not" x="40" y="668">✕ No direct link between modules: each keeps its own folder and asks the hub, which checks the link (this project, this server, this deployment).</text>
</svg>
