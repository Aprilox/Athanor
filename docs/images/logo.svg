<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#243245"/>
      <stop offset="1" stop-color="#121a24"/>
    </linearGradient>
    <linearGradient id="ring" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5fe3c1"/>
      <stop offset="1" stop-color="#2fb393"/>
    </linearGradient>
  </defs>
  <!-- tile -->
  <rect x="8" y="8" width="240" height="240" rx="56" fill="url(#bg)"/>
  <rect x="8" y="8" width="240" height="240" rx="56" fill="none" stroke="#ffffff" stroke-opacity="0.08" stroke-width="2"/>
  <!-- cycle ring: open loop with an arrow head (the pilot loops on its own) -->
  <path d="M 186 79 A 76 76 0 1 0 204 128" fill="none" stroke="url(#ring)" stroke-width="18" stroke-linecap="round"/>
  <path d="M 184 136 L 224 136 L 204 104 Z" fill="#3cc4a4"/>
  <!-- the A: a chevron with a bar, like a heading mark -->
  <path d="M 92 168 L 128 86 L 164 168" fill="none" stroke="#ffffff" stroke-width="18" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M 109 138 L 147 138" fill="none" stroke="#ffffff" stroke-width="16" stroke-linecap="round"/>
</svg>
