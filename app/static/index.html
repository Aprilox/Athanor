<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Athanor</title>
<meta name="csrf" content="__CSRF__">
<link rel="icon" href="logo.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header id="fenetre-barre" class="fb" hidden>
  <div class="fb-glisser">
    <img src="logo.svg" width="16" height="16" alt="" class="fb-logo" draggable="false">
    <span class="fb-nom">Athanor</span>
    <span class="fb-projet" id="fb-projet"></span>
  </div>
  <div class="fb-actions" id="fb-actions"></div>
  <div class="fb-boutons">
    <button type="button" class="fb-btn" data-fenetre="reduire" tabindex="-1">&#xE921;</button>
    <button type="button" class="fb-btn" data-fenetre="agrandir" tabindex="-1">&#xE922;</button>
    <button type="button" class="fb-btn fb-fermer" data-fenetre="fermer" tabindex="-1">&#xE8BB;</button>
  </div>
</header>
<div id="app" class="app">
  <aside class="nav">
    <div class="marque">
      <img src="logo.svg" width="30" height="30" alt="" class="marque-logo">
      <div><div class="marque-nom">Athanor <button type="button" class="marque-version" id="nav-version" data-maj="ouvrir"></button></div><div class="marque-sous" id="nav-sous">—</div></div>
    </div>
    <div class="selecteur">
      <button id="sel-projet" class="sel-projet" type="button" aria-haspopup="listbox"></button>
      <div id="menu-projets" class="menu-projets" hidden></div>
    </div>
    <div class="nav-titre" id="nav-titre-projet">Project</div>
    <nav id="nav-liens">
      <a href="#suivi" data-page="suivi">Overview</a>
      <a href="#equipe" data-page="equipe">Team</a>
      <a href="#demandes" data-page="demandes">Requests</a>
      <a href="#chat" data-page="chat">Chat</a>
      <a href="#pourvous" data-page="pourvous">For you</a>
      <a href="#journal" data-page="journal">Log</a>
    </nav>
    <div class="nav-titre" id="nav-titre-outil">Tool</div>
    <nav id="nav-outil">
      <a href="#extensions" data-page="extensions">Skills &amp; MCP</a>
      <a href="#sante" data-page="sante">Setup &amp; health</a>
      <a href="#reglages" data-page="reglages">Settings</a>
    </nav>
    <div class="nav-pied">
      <button id="btn-verrou" class="btn-fantome" type="button">🔒 Lock</button>
      <div class="nav-kit" id="nav-kit"></div>
    </div>
  </aside>

  <main class="principal">
    <header class="bandeau" id="bandeau"></header>
    <section class="page" id="page"></section>
    <div class="toast" id="toast" hidden></div>
  </main>

  <div class="assistant" id="assistant" hidden></div>
  <div class="dialogue" id="dialogue" hidden role="dialog" aria-modal="true" aria-labelledby="dialogue-texte">
    <div class="dialogue-carte">
      <h3 id="dialogue-titre" hidden></h3>
      <p id="dialogue-texte"></p>
      <div class="dialogue-boutons">
        <button type="button" class="btn" id="dialogue-annuler"></button>
        <button type="button" class="btn btn-primaire" id="dialogue-ok"></button>
      </div>
    </div>
  </div>
  <div class="dialogue" id="choix" hidden role="dialog" aria-modal="true" aria-labelledby="choix-texte">
    <div class="dialogue-carte">
      <h3 id="choix-titre" hidden></h3>
      <p id="choix-texte"></p>
      <div class="dialogue-boutons" id="choix-boutons"></div>
    </div>
  </div>
  <div class="visite-voile" id="visite-voile" hidden></div>
  <div class="visite" id="visite" hidden></div>
  <div class="dialogue dialogue-fermeture" id="fermeture" hidden role="alertdialog" aria-modal="true" aria-labelledby="fermeture-titre">
    <div class="dialogue-carte">
      <h3 id="fermeture-titre"></h3>
      <p id="fermeture-texte"></p>
      <p id="fermeture-aide" class="muet petit"></p>
      <div class="dialogue-boutons">
        <button type="button" class="btn" data-fermer="annuler"></button>
        <button type="button" class="btn btn-danger" data-fermer="arreter"></button>
        <button type="button" class="btn btn-primaire" data-fermer="continuer"></button>
      </div>
    </div>
  </div>
  <div class="dialogue" id="ecran" hidden role="dialog" aria-modal="true" aria-labelledby="ecran-titre">
    <div class="dialogue-carte ecran-carte">
      <div class="ecran-tete"><h3 id="ecran-titre">Claude's screen</h3><button type="button" class="btn btn-petit" id="ecran-fermer">Close</button></div>
      <img id="ecran-img" alt="" hidden>
      <p id="ecran-msg" class="muet"></p>
    </div>
  </div>
  <div class="verrou" id="verrou" hidden>
    <div class="verrou-carte">
      <div class="verrou-cadenas">🔒</div>
      <h1 id="verrou-titre">Application locked</h1>
      <p id="verrou-etat"></p>
      <form id="verrou-form">
        <input type="password" id="verrou-mdp" placeholder="Password" autocomplete="current-password" autofocus>
        <button type="submit" class="btn btn-primaire" id="verrou-bouton">Unlock</button>
      </form>
      <p class="verrou-erreur" id="verrou-erreur"></p>
    </div>
  </div>
</div>
<script src="i18n.js"></script>
<script src="app.js"></script>
</body>
</html>
