# Checks every push and pull request on the three systems Athanor moves to (docs: "Athanor en Go"):
# vet and tests of the Go code, and every build target.
# A failure on any of them turns the run red. A release runs these same checks first (release.yml): a version
# is published only once all of them pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Format
        if: runner.os == 'Linux'
        # the vendored third_party code keeps its upstream formatting
        run: |
          f="$(gofmt -l . | grep -v third_party || true)"
          if [ -n "$f" ]; then echo "::error::not formatted by gofmt: $f"; exit 1; fi
      - name: Vet
        run: go vet .
      - name: Tests
        shell: bash
        # nobody to ask on a runner: the real mDNS socket and the real Keychain / Secret Service are tested here
        # (skipped on a developer's computer, where they would open a firewall or keychain prompt)
        env:
          ATHANOR_TEST_RESEAU: "1"
          ATHANOR_TEST_TROUSSEAU_REEL: "1"
        # the failures also go into the run's annotations (readable without opening the whole log)
        run: |
          set +e   # the step's shell stops at the first failure otherwise (-e, pipefail): the annotations below would never be written
          # an athanor build for the tests that run the real executable (the macOS cage, the chat's script…)
          if [ "$RUNNER_OS" != Windows ]; then go build -o "$RUNNER_TEMP/athanor-test" . && export ATHANOR_BIN_TEST="$RUNNER_TEMP/athanor-test"; fi
          # the whole suite takes about 9 minutes on the Windows runners: room beyond go test's 10-minute default
          go test -timeout 30m ./... > test.log 2>&1; code=$?
          cat test.log
          if [ "$code" != 0 ]; then
            # one annotation per failed test, with its messages (readable through the API, without the log)
            enc() { tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            awk '/^--- FAIL|^    --- FAIL/ {if (b != "") print b > ("fail-" n ".txt"); n++; b=$0; next}
                 b != "" && /^[ \t]/ {if (length(b) < 3500) b = b "\n" $0; next}
                 b != "" {print b > ("fail-" n ".txt"); b=""}
                 END {if (b != "") print b > ("fail-" n ".txt")}' n=0 test.log
            i=0
            for f in $(ls fail-*.txt 2>/dev/null | sort -t- -k2 -n); do
              i=$((i+1)); niveau=error; [ $i -gt 10 ] && niveau=warning; [ $i -gt 20 ] && niveau=notice; [ $i -gt 30 ] && break
              echo "::$niveau title=$(head -n1 "$f" | tr -d '\r' | sed -e 's/^ *//' -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | cut -c1-120)::$(enc < "$f")"
            done
            # no failed test reported (a panic, a timeout): what was running, and where the tests stood
            if [ $i = 0 ]; then
              { grep -a -A4 -E '^panic:|running tests' test.log | head -n 20; grep -a -E '_test\.go:[0-9]+' test.log | sort | uniq -c | sort -rn | head -n 20; } > pile.txt
              echo "::error title=go test ${{ runner.os }} (panic or timeout)::$(enc < pile.txt)"
              echo "::warning title=go test ${{ runner.os }} (end of the log)::$(tail -n 40 test.log | enc)"
            fi
          fi
          exit "$code"
      - name: Mac application
        if: runner.os == 'macOS'
        timeout-minutes: 5
        # Athanor.app's Dock icon, menus and delegate built through Cocoa, then its Dock menu and a click on
        # the icon asked for as the Dock does (app/app_mac_darwin_test.go)
        run: ATHANOR_ESSAI_COCOA=1 go test -run TestCocoa -v .
      - name: Single executable
        shell: bash
        timeout-minutes: 10
        # the downloaded file alone: nothing written before the consent, then Athanor's folder installed
        # in the user's data folder (app/embarque.go), nothing next to the file
        run: |
          set -e
          go run . construire
          d="$RUNNER_TEMP/telecharge"; mkdir -p "$d"
          case "$RUNNER_OS" in
            Windows) exe=Athanor.exe; donnees="$RUNNER_TEMP/donnees"; kit="$donnees/Athanor"; lancer() { LOCALAPPDATA="$(cygpath -w "$donnees")" "$@"; } ;;
            Linux) exe=athanor; donnees="$RUNNER_TEMP/donnees"; kit="$donnees/athanor"; lancer() { XDG_DATA_HOME="$donnees" "$@"; } ;;
            macOS) exe=athanor; donnees="$RUNNER_TEMP/maison"; kit="$donnees/Library/Application Support/Athanor"; lancer() { HOME="$donnees" "$@"; } ;;
          esac
          cp "../$exe" "$d/"
          cd "$d"
          v="$(./$exe version | tr -d '\r')"
          if [ "$RUNNER_OS" = Linux ]; then
            # no one to answer: refused, nothing written (Windows and macOS show their dialog, which would
            # wait for a click on the runner's screen)
            if lancer "./$exe" autotest < /dev/null; then echo "::error::launched without consent"; exit 1; fi
            if [ -e "$kit" ]; then echo "::error::written before the consent"; exit 1; fi
          fi
          lancer "./$exe" --oui autotest
          test -f "$kit/template/CLAUDE.md" && test -f "$kit/.env.example" && test -f "$kit/LICENSE"
          [ "$(tr -d '\r' < "$kit/system/version.txt")" = "$v" ] || { echo "::error::version.txt"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then test -f "$kit/Athanor.exe" && test -f "$kit/athanor"; else test -x "$kit/athanor"; fi
          [ "$(ls -A "$d")" = "$exe" ] || { echo "::error::files written next to the downloaded executable: $(ls -A "$d")"; exit 1; }
          # a second launch changes nothing and runs the kit's copy
          lancer "./$exe" autotest
          echo "single executable OK ($v): $(ls -A "$kit" | tr '\n' ' ')"

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Every build target
        working-directory: app
        run: go run . construire --all

  two-instances:
    # two real Athanor executables in separate folders (app/deux_instances_test.go): paired by a 6-digit code
    # and the owner's accord, the hub reads the other's state and pauses its project's pilot at the end of
    # its cycle; a client never paired is refused
    runs-on: ubuntu-latest
    timeout-minutes: 5
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Two instances
        # a skip would pass silently: the PASS line is required
        run: |
          go test -count=1 -timeout 4m -run '^TestDeuxInstances$' -v . | tee deux.log
          grep -q -- '--- PASS: TestDeuxInstances' deux.log

  servers-ssh:
    # the Servers module against a real sshd (app/testdata/serveur-ssh, never a real server): an agent's MCP
    # route adds it, reads its sheet, changes it only by an accepted plan, is refused destructive or masked
    # commands, and an unconfirmed firewall rule is undone by the server itself (app/serveurs_ci_test.go);
    # Caddy serves its default page on the published HTTP port, before and after a reload over SSH;
    # the sample site end to end: dev behind the fake Cloudflare, v1, v2, back to v1, prod only with the accord,
    # an incident in the bell, no witness value anywhere an agent reads (app/deploiements_temoin_test.go)
    # the mission of V§1 (boulangerie Martin): sentence → card → Modifier → Lancer, and the orchestrator's scope
    # (app/mission_martin_test.go, app/mission_outils_test.go); P5, that mission end to end: dev behind auth_proxy,
    # Athanor restarted halfway, the prod accord from a paired phone, Revenir (app/mission_p5_test.go)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Test SSH server
        # free ports chosen by Docker, on 127.0.0.1 only (SSH and Caddy's HTTP); NET_ADMIN for ufw
        run: |
          docker build -q -t athanor-serveur-ssh testdata/serveur-ssh
          docker run -d --name athanor-serveur-ssh --cap-add NET_ADMIN -p 127.0.0.1::22 -p 127.0.0.1::80 athanor-serveur-ssh
          port="$(docker port athanor-serveur-ssh 22/tcp | head -n1 | sed 's/.*://')"
          echo "ATHANOR_SSH_HTTP=127.0.0.1:$(docker port athanor-serveur-ssh 80/tcp | head -n1 | sed 's/.*://')" >> "$GITHUB_ENV"
          for _ in $(seq 1 50); do  # ready once sshd shows its banner
            if timeout 2 bash -c "exec 3<>/dev/tcp/127.0.0.1/$port && head -c 4 <&3" 2>/dev/null | grep -q SSH; then
              echo "ATHANOR_SSH_TEST=127.0.0.1:$port" >> "$GITHUB_ENV"; exit 0
            fi
            sleep 0.2
          done
          echo "::error::test SSH server unreachable"; docker logs athanor-serveur-ssh | tail -n 20; exit 1
      - name: Servers tests on the container
        # a skip (ATHANOR_SSH_TEST lost) would pass silently: the PASS line is required
        run: |
          go test -count=1 -timeout 10m -run '^(TestServeursCIConteneur|TestCaddyConteneur|TestDeploiementStatiqueConteneur|TestDeploiementGitConteneur|TestDeploiementComposeConteneur|TestDeploiementK3sConteneur|TestDeploiementAgentConteneur|TestRelaisJalonConteneur|TestDurcirConteneur|TestTerminalConteneur|TestSiteExempleTemoinConteneur|TestMissionCarteMartin|TestOrchestrateurPerimetre|TestMissionP5)$' -v . | tee ci.log
          grep -q -- '--- PASS: TestServeursCIConteneur' ci.log
          grep -q -- '--- PASS: TestCaddyConteneur' ci.log
          grep -q -- '--- PASS: TestTerminalConteneur' ci.log
          grep -q -- '--- PASS: TestDeploiementStatiqueConteneur' ci.log
          grep -q -- '--- PASS: TestDeploiementGitConteneur' ci.log
          grep -q -- '--- PASS: TestDeploiementComposeConteneur' ci.log
          grep -q -- '--- PASS: TestDeploiementK3sConteneur' ci.log
          grep -q -- '--- PASS: TestDeploiementAgentConteneur' ci.log
          grep -q -- '--- PASS: TestRelaisJalonConteneur' ci.log
          grep -q -- '--- PASS: TestDurcirConteneur' ci.log
          grep -q -- '--- PASS: TestSiteExempleTemoinConteneur' ci.log
          grep -q -- '--- PASS: TestMissionCarteMartin' ci.log
          grep -q -- '--- PASS: TestOrchestrateurPerimetre' ci.log
          grep -q -- '--- PASS: TestMissionP5' ci.log

  vuln:
    # known vulnerabilities of the Go standard library and of the modules, in the code Athanor really calls
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: govulncheck
        # pinned: a new release of the tool never changes the result of an old commit
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@v1.9.0
          "$(go env GOPATH)/bin/govulncheck" ./...

  secrets:
    # no secret committed anywhere in the history (.gitleaks.toml, .gitleaksignore); gitleaks pinned and checked
    # against its published SHA-256: no third-party action, no licence key
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          set -e
          f="$RUNNER_TEMP/gitleaks.tar.gz"
          curl -sSfL -o "$f" "https://github.com/gitleaks/gitleaks/releases/download/v$VERSION/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "$SHA256  $f" | sha256sum -c -
          tar -xzf "$f" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --redact --no-banner --verbose .
