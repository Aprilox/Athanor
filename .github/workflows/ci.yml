# Checks every push and pull request on the three systems Athanor moves to (docs: "Athanor en Go"):
# vet and tests of the Go code, and every build target.
# A failure on any of them turns the run red. A release runs these same checks first (release.yml): a version
# is published only once all of them pass.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Vet
        run: go vet .
      - name: Tests
        shell: bash
        # the failures also go into the run's annotations (readable without opening the whole log)
        run: |
          set +e   # the step's shell stops at the first failure otherwise (-e, pipefail): the annotations below would never be written
          # an athanor build for the tests that run the real executable (the macOS cage, the chat's script…)
          if [ "$RUNNER_OS" != Windows ]; then go build -o "$RUNNER_TEMP/athanor-test" . && export ATHANOR_BIN_TEST="$RUNNER_TEMP/athanor-test"; fi
          go test ./... > test.log 2>&1; code=$?
          cat test.log
          if [ "$code" != 0 ]; then
            # one annotation per failed test, with its messages (readable through the API, without the log)
            enc() { tr -d '\r' | sed -e 's/%/%25/g' | awk '{printf "%s%%0A", $0}'; }
            awk '/^--- FAIL|^    --- FAIL/ {if (b != "") print b > ("fail-" n ".txt"); n++; b=$0; next}
                 b != "" && /^[ \t]/ {if (length(b) < 3500) b = b "\n" $0; next}
                 b != "" {print b > ("fail-" n ".txt"); b=""}
                 END {if (b != "") print b > ("fail-" n ".txt")}' n=0 test.log
            i=0
            for f in $(ls fail-*.txt 2>/dev/null | sort -t- -k2 -n); do
              i=$((i+1)); niveau=error; [ $i -gt 10 ] && niveau=warning; [ $i -gt 20 ] && niveau=notice; [ $i -gt 30 ] && break
              echo "::$niveau title=$(head -n1 "$f" | tr -d '\r' | sed -e 's/^ *//' -e 's/%/%25/g' -e 's/:/%3A/g' -e 's/,/%2C/g' | cut -c1-120)::$(enc < "$f")"
            done
            # no failed test reported (a panic, a timeout): what was running, and where the tests stood
            if [ $i = 0 ]; then
              { grep -a -A4 -E '^panic:|running tests' test.log | head -n 20; grep -a -E '_test\.go:[0-9]+' test.log | sort | uniq -c | sort -rn | head -n 20; } > pile.txt
              echo "::error title=go test ${{ runner.os }} (panic or timeout)::$(enc < pile.txt)"
              echo "::warning title=go test ${{ runner.os }} (end of the log)::$(tail -n 40 test.log | enc)"
            fi
          fi
          exit "$code"
      - name: Mac application
        if: runner.os == 'macOS'
        timeout-minutes: 5
        # Athanor.app's Dock icon, menus and delegate built through Cocoa, then its Dock menu and a click on
        # the icon asked for as the Dock does (app/app_mac_darwin_test.go)
        run: ATHANOR_ESSAI_COCOA=1 go test -run TestCocoa -v .
      - name: Single executable
        shell: bash
        timeout-minutes: 10
        # the downloaded file alone: nothing written before the consent, then Athanor's folder installed
        # in the user's data folder (app/embarque.go), nothing next to the file
        run: |
          set -e
          go run . construire
          d="$RUNNER_TEMP/telecharge"; mkdir -p "$d"
          case "$RUNNER_OS" in
            Windows) exe=Athanor.exe; donnees="$RUNNER_TEMP/donnees"; kit="$donnees/Athanor"; lancer() { LOCALAPPDATA="$(cygpath -w "$donnees")" "$@"; } ;;
            Linux) exe=athanor; donnees="$RUNNER_TEMP/donnees"; kit="$donnees/athanor"; lancer() { XDG_DATA_HOME="$donnees" "$@"; } ;;
            macOS) exe=athanor; donnees="$RUNNER_TEMP/maison"; kit="$donnees/Library/Application Support/Athanor"; lancer() { HOME="$donnees" "$@"; } ;;
          esac
          cp "../$exe" "$d/"
          cd "$d"
          v="$(./$exe version | tr -d '\r')"
          if [ "$RUNNER_OS" = Linux ]; then
            # no one to answer: refused, nothing written (Windows and macOS show their dialog, which would
            # wait for a click on the runner's screen)
            if lancer "./$exe" autotest < /dev/null; then echo "::error::launched without consent"; exit 1; fi
            if [ -e "$kit" ]; then echo "::error::written before the consent"; exit 1; fi
          fi
          lancer "./$exe" --oui autotest
          test -f "$kit/template/CLAUDE.md" && test -f "$kit/.env.example" && test -f "$kit/LICENSE"
          [ "$(tr -d '\r' < "$kit/system/version.txt")" = "$v" ] || { echo "::error::version.txt"; exit 1; }
          if [ "$RUNNER_OS" = Windows ]; then test -f "$kit/Athanor.exe" && test -f "$kit/athanor"; else test -x "$kit/athanor"; fi
          [ "$(ls -A "$d")" = "$exe" ] || { echo "::error::files written next to the downloaded executable: $(ls -A "$d")"; exit 1; }
          # a second launch changes nothing and runs the kit's copy
          lancer "./$exe" autotest
          echo "single executable OK ($v): $(ls -A "$kit" | tr '\n' ' ')"

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Every build target
        working-directory: app
        run: go run . construire --all
