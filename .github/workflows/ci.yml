# Checks every push and pull request on the three systems Athanor moves to (docs: "Athanor en Go"):
# vet and tests of the Go code, every build target, and the syntax of the scripts that are still bash.
# Windows and macOS are informative while the code is first checked there (continue-on-error); they
# become blocking once green.
name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  go:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    continue-on-error: ${{ matrix.os != 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Vet
        run: go vet .
      - name: Tests
        shell: bash
        # the failures also go into the run's annotations (readable without opening the whole log)
        run: |
          go test ./... 2>&1 | tee test.log; code=${PIPESTATUS[0]}
          if [ "$code" != 0 ]; then
            msg=$(grep -E -- '--- FAIL|^panic|^FAIL|_test\.go:[0-9]+:|\.go:[0-9]+:[0-9]+:' test.log | head -n 60 | sed -e 's/%/%25/g' -e 's/\r//g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=go test (${{ runner.os }})::${msg}"
          fi
          exit "$code"

  targets:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
      - name: Every build target
        working-directory: app
        run: bash build.sh --all
      - name: Scripts syntax
        run: for f in system/*.sh system/bin/* system/natif/* commands/*.sh; do bash -n "$f" || exit 1; done
