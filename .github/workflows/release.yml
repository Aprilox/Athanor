# Builds Athanor for Windows, Linux and macOS and publishes a GitHub Release every time a version tag is
# pushed:
#   git tag v2.26.0 && git push origin v2.26.0
# Each download is a single executable that carries everything it needs (app/embarque.go).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Check
        working-directory: app
        run: |
          go vet .
          GOOS=windows GOARCH=amd64 go vet .
          go test ./...

      - name: Build
        working-directory: app
        # every target into dist/, each one carrying the kit's files (and Athanor.exe the Linux executable of
        # the WSL mode); the Windows icon and version come from the committed rsrc_windows_amd64.syso
        run: go run . construire --all

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # one file per system, the same names at every version (a stable link to the latest one)
          mkdir -p publie
          cp dist/Athanor-amd64.exe publie/Athanor.exe
          cp dist/Athanor-arm64.exe publie/Athanor-arm64.exe
          install -m 755 dist/athanor-linux-amd64 publie/athanor-linux
          install -m 755 dist/athanor-linux-arm64 publie/athanor-linux-arm64
          install -m 755 dist/athanor-darwin-arm64 publie/athanor-macos
          install -m 755 dist/athanor-darwin-amd64 publie/athanor-macos-intel
          (cd publie && sha256sum ./* | sed 's#\./##' > SHA256SUMS.txt)
          ls -l publie
          # Release text: what is new (docs/releases/VERSION.md, when present), then the downloads.
          depot="https://github.com/${GITHUB_REPOSITORY}"
          telecharger="${depot}/releases/download/${GITHUB_REF_NAME}"
          {
            if [ -f "docs/releases/${version}.md" ]; then cat "docs/releases/${version}.md"; echo; fi
            echo "## Download"
            echo
            echo "One file, nothing to unzip. Keep it wherever you like: at its first launch it asks before creating Athanor's folder, then it opens Athanor."
            echo
            echo "| Your system | Download | Then |"
            echo "|---|---|---|"
            echo "| **Windows 10 / 11** | [**Athanor.exe**](${telecharger}/Athanor.exe) | double-click it (ARM PC: [Athanor-arm64.exe](${telecharger}/Athanor-arm64.exe)) |"
            echo "| **Linux** (x86-64) | [**athanor-linux**](${telecharger}/athanor-linux) | \`chmod +x athanor-linux && ./athanor-linux\` (ARM: [athanor-linux-arm64](${telecharger}/athanor-linux-arm64)) |"
            echo "| **macOS** (Apple Silicon) | [**athanor-macos**](${telecharger}/athanor-macos) | in Terminal: \`cd ~/Downloads && chmod +x athanor-macos && xattr -d com.apple.quarantine athanor-macos && ./athanor-macos\` (see [macOS, step by step](${depot}#macos-step-by-step)) |"
            echo "| **macOS** (Intel) | [**athanor-macos-intel**](${telecharger}/athanor-macos-intel) | the same, with this file |"
            echo
            echo "**Updating:** close Athanor (right click on its icon near the clock → *Quit* if it started with the computer), then open the new file: it updates Athanor's folder, your token, settings, projects, \`logs/\` and \`tools/\` are kept."
            echo
            echo "First launch: see the [Quick start](${depot}#quick-start) ([en français](${depot}/blob/main/README.fr.md#démarrage-rapide)). Checksums: \`SHA256SUMS.txt\`."
          } > release.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Athanor ${{ env.VERSION }}
          generate_release_notes: true
          body_path: release.md
          files: |
            publie/Athanor.exe
            publie/Athanor-arm64.exe
            publie/athanor-linux
            publie/athanor-linux-arm64
            publie/athanor-macos
            publie/athanor-macos-intel
            publie/SHA256SUMS.txt
