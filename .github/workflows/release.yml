# Builds Athanor for Windows and Linux and publishes a GitHub Release every time a version tag is pushed:
#   git tag v2.0.1 && git push origin v2.0.1
# Each download is the complete tool (the app needs commands/, system/ and template/ next to it).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Check
        working-directory: app
        run: |
          go vet .
          GOOS=windows GOARCH=amd64 go vet .
          go test ./...

      - name: Build
        working-directory: app
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../build
          # Windows: GUI app, icon and version info come from the committed rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../build/Athanor.exe .
          # Linux: static binary, runs on any distribution
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/athanor .

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          # the repository as committed (modes and line endings preserved)
          export_tree() { rm -rf "pkg-$1" && mkdir -p "pkg-$1" && git archive --format=tar --prefix=athanor/ HEAD | tar -x -C "pkg-$1"; }
          # Windows: zip, with Athanor.exe
          export_tree windows
          cp build/Athanor.exe pkg-windows/athanor/Athanor.exe
          (cd pkg-windows && zip -qr -X "../dist/Athanor-${version}-Windows.zip" athanor)
          # Linux: tar.gz (keeps the executable bits), with athanor
          export_tree linux
          install -m 755 build/athanor pkg-linux/athanor/athanor
          tar -C pkg-linux -czf "dist/Athanor-${version}-Linux.tar.gz" athanor
          (cd dist && sha256sum ./* | sed 's#\./##' > SHA256SUMS.txt)
          ls -l dist

      - uses: softprops/action-gh-release@v2
        with:
          name: Athanor ${{ env.VERSION }}
          generate_release_notes: true
          body: |
            ## Download

            | Your system | Download | Then |
            |---|---|---|
            | **Windows 10 / 11** | [**Athanor-${{ env.VERSION }}-Windows.zip**](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Athanor-${{ env.VERSION }}-Windows.zip) | unzip anywhere, double-click **`Athanor.exe`** |
            | **Linux** (x86-64) | [**Athanor-${{ env.VERSION }}-Linux.tar.gz**](https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/Athanor-${{ env.VERSION }}-Linux.tar.gz) | `tar xzf Athanor-${{ env.VERSION }}-Linux.tar.gz && cd athanor && commands/install.sh && ./athanor` |

            Each download is the complete tool, ready to use. **Updating:** close the app and extract the new version in the same place: your token, settings, `logs/` and `tools/` are kept.

            First launch: see the [Quick start](https://github.com/${{ github.repository }}#quick-start) ([en français](https://github.com/${{ github.repository }}/blob/main/README.fr.md#démarrage-rapide)). Checksums: `SHA256SUMS.txt`.
          files: |
            dist/Athanor-${{ env.VERSION }}-Windows.zip
            dist/Athanor-${{ env.VERSION }}-Linux.tar.gz
            dist/SHA256SUMS.txt
