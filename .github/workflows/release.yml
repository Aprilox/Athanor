# Builds Athanor for Windows and Linux and publishes a GitHub Release every time a version tag is pushed:
#   git tag v2.0.1 && git push origin v2.0.1
# Each download is the complete tool (the app needs commands/, system/ and template/ next to it).
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Check
        working-directory: app
        run: |
          go vet .
          GOOS=windows GOARCH=amd64 go vet .
          go test ./...

      - name: Build
        working-directory: app
        env:
          CGO_ENABLED: "0"
        run: |
          mkdir -p ../build
          # Windows: GUI app, icon and version info come from the committed rsrc_windows_amd64.syso
          GOOS=windows GOARCH=amd64 go build -trimpath -ldflags "-s -w -H windowsgui" -o ../build/Athanor.exe .
          # Linux: static binary, runs on any distribution
          GOOS=linux GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/athanor .
          # macOS: Apple Silicon and Intel (not signed: see the Quick start)
          GOOS=darwin GOARCH=arm64 go build -trimpath -ldflags "-s -w" -o ../build/athanor-mac-arm64 .
          GOOS=darwin GOARCH=amd64 go build -trimpath -ldflags "-s -w" -o ../build/athanor-mac-amd64 .

      - name: Package
        run: |
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          mkdir -p dist
          # the repository as committed (modes and line endings preserved)
          export_tree() { rm -rf "pkg-$1" && mkdir -p "pkg-$1" && git archive --format=tar --prefix=athanor/ HEAD | tar -x -C "pkg-$1"; }
          # Windows: zip, with Athanor.exe
          export_tree windows
          cp build/Athanor.exe pkg-windows/athanor/Athanor.exe
          # its Linux twin: the pilots of the WSL mode run the kit's Go helpers with it (athanor relais…)
          cp build/athanor pkg-windows/athanor/athanor
          (cd pkg-windows && zip -qr -X "../dist/Athanor-${version}-Windows.zip" athanor)
          # Linux: tar.gz (keeps the executable bits), with athanor
          export_tree linux
          install -m 755 build/athanor pkg-linux/athanor/athanor
          tar -C pkg-linux -czf "dist/Athanor-${version}-Linux.tar.gz" athanor
          # macOS: tar.gz, with athanor (one per processor)
          for arch in arm64 amd64; do
            export_tree "mac-$arch"
            install -m 755 "build/athanor-mac-$arch" "pkg-mac-$arch/athanor/athanor"
            nom=AppleSilicon; [ "$arch" = amd64 ] && nom=Intel
            tar -C "pkg-mac-$arch" -czf "dist/Athanor-${version}-macOS-${nom}.tar.gz" athanor
          done
          (cd dist && sha256sum ./* | sed 's#\./##' > SHA256SUMS.txt)
          ls -l dist
          # Release text: what is new (docs/releases/VERSION.md, when present), then the downloads.
          depot="https://github.com/${GITHUB_REPOSITORY}"
          telecharger="${depot}/releases/download/${GITHUB_REF_NAME}"
          {
            if [ -f "docs/releases/${version}.md" ]; then cat "docs/releases/${version}.md"; echo; fi
            echo "## Download"
            echo
            echo "| Your system | Download | Then |"
            echo "|---|---|---|"
            echo "| **Windows 10 / 11** | [**Athanor-${version}-Windows.zip**](${telecharger}/Athanor-${version}-Windows.zip) | unzip anywhere, double-click **\`Athanor.exe\`** |"
            echo "| **Linux** (x86-64) | [**Athanor-${version}-Linux.tar.gz**](${telecharger}/Athanor-${version}-Linux.tar.gz) | \`tar xzf Athanor-${version}-Linux.tar.gz && cd athanor && commands/install.sh && ./athanor\` |"
            echo "| **macOS** (Apple Silicon) | [**Athanor-${version}-macOS-AppleSilicon.tar.gz**](${telecharger}/Athanor-${version}-macOS-AppleSilicon.tar.gz) | \`tar xzf Athanor-${version}-macOS-AppleSilicon.tar.gz && cd athanor && xattr -dr com.apple.quarantine . && commands/install.sh && ./athanor\` |"
            echo "| **macOS** (Intel) | [**Athanor-${version}-macOS-Intel.tar.gz**](${telecharger}/Athanor-${version}-macOS-Intel.tar.gz) | the same, with this archive |"
            echo
            echo "Each download is the complete tool, ready to use. **Updating:** close the app (right click on its icon → *Quit* if it started with Windows) and extract the new version in the same place: your token, settings, \`logs/\` and \`tools/\` are kept."
            echo
            echo "First launch: see the [Quick start](${depot}#quick-start) ([en français](${depot}/blob/main/README.fr.md#démarrage-rapide)). Checksums: \`SHA256SUMS.txt\`."
          } > release.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Athanor ${{ env.VERSION }}
          generate_release_notes: true
          body_path: release.md
          files: |
            dist/Athanor-${{ env.VERSION }}-Windows.zip
            dist/Athanor-${{ env.VERSION }}-Linux.tar.gz
            dist/Athanor-${{ env.VERSION }}-macOS-AppleSilicon.tar.gz
            dist/Athanor-${{ env.VERSION }}-macOS-Intel.tar.gz
            dist/SHA256SUMS.txt
