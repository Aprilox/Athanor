# Builds Athanor for Windows, Linux and macOS and publishes a GitHub Release every time a version tag is
# pushed:
#   git tag v2.26.0 && git push origin v2.26.0
# Each download is a single executable that carries everything it needs (app/embarque.go); on the Mac,
# Athanor.app around it.
# Nothing is published before every check of CI (ci.yml: vet and tests on Windows, Linux and macOS, the single
# executable, every build target) has passed on the tagged commit; if any of them fails, or anything after
# them, the tag is removed (and the release, if it was already created), so Athanor's updates never offer it:
# fix, commit, and push the same tag again.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  checks:
    # the whole CI on the tagged commit, on the three systems
    uses: ./.github/workflows/ci.yml

  build:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: app/go.mod
          cache: false

      - name: Build
        working-directory: app
        # every target into dist/, each one carrying the kit's files (and Athanor.exe the Linux executable of
        # the WSL mode), and Athanor.app (both Mac executables in one); the Windows icon and version come from
        # the committed rsrc_windows_amd64.syso
        run: go run . construire --all

      # a tar keeps the executables' modes (the artifacts do not)
      - run: tar czf dist.tgz dist
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist.tgz

  mac:
    # Athanor.app signed on a Mac (an ad-hoc signature: no Apple account; macOS asks once to allow it),
    # checked, then zipped
    needs: build
    runs-on: macos-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - name: Sign and check Athanor.app
        run: |
          set -e
          tar xzf dist.tgz
          codesign --force --deep --sign - dist/Athanor.app
          codesign --verify --deep --strict --verbose=2 dist/Athanor.app
          lipo -info dist/Athanor.app/Contents/MacOS/athanor
          # the bundle's executable installs Athanor's folder, then the copy kept there runs
          maison="$RUNNER_TEMP/maison"; mkdir -p "$maison"
          HOME="$maison" dist/Athanor.app/Contents/MacOS/athanor --oui autotest
          test -x "$maison/Library/Application Support/Athanor/athanor"
          ditto -c -k --sequesterRsrc --keepParent dist/Athanor.app Athanor-macOS.zip
          # where Athanor's own update on the Mac takes the executable (app/maj.go)
          unzip -l Athanor-macOS.zip | grep -q " Athanor.app/Contents/MacOS/athanor$"
      - uses: actions/upload-artifact@v4
        with:
          name: mac
          path: Athanor-macOS.zip

  publish:
    needs: [build, mac]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dist
      - uses: actions/download-artifact@v4
        with:
          name: mac

      - name: Package
        run: |
          tar xzf dist.tgz
          version="${GITHUB_REF_NAME#v}"
          echo "VERSION=$version" >> "$GITHUB_ENV"
          # one file per system, the same names at every version (a stable link to the latest one); Athanor's
          # own updates download the same files (app/maj.go: nomFichierMaj)
          mkdir -p publie
          cp dist/Athanor-amd64.exe publie/Athanor-Windows-x64.exe
          cp dist/Athanor-arm64.exe publie/Athanor-Windows-ARM64.exe
          install -m 755 dist/athanor-linux-amd64 publie/Athanor-Linux-x64
          install -m 755 dist/athanor-linux-arm64 publie/Athanor-Linux-ARM64
          cp Athanor-macOS.zip publie/Athanor-macOS.zip
          (cd publie && sha256sum ./* | sed 's#\./##' > SHA256SUMS.txt)
          ls -l publie
          # Release text: what is new (docs/releases/VERSION.md, when present), then the downloads.
          depot="https://github.com/${GITHUB_REPOSITORY}"
          telecharger="${depot}/releases/download/${GITHUB_REF_NAME}"
          {
            if [ -f "docs/releases/${version}.md" ]; then cat "docs/releases/${version}.md"; echo; fi
            echo "## Download"
            echo
            echo "**One file for your system** (the other files are for Athanor's own updates: you do not need them):"
            echo
            echo "| Your system | Download | Then |"
            echo "|---|---|---|"
            echo "| **Windows 10 / 11** | [**Athanor-Windows-x64.exe**](${telecharger}/Athanor-Windows-x64.exe) | double-click it. An ARM PC (Snapdragon…): [Athanor-Windows-ARM64.exe](${telecharger}/Athanor-Windows-ARM64.exe) |"
            echo "| **macOS** 11 or later | [**Athanor-macOS.zip**](${telecharger}/Athanor-macOS.zip) | Apple Silicon and Intel. Safari opens the zip by itself (else a double-click): open **Athanor.app**, from *Downloads* or *Applications*; the first time, macOS asks to allow it: *System Settings → Privacy & Security → Open Anyway* (see [macOS, step by step](${depot}#macos-step-by-step)) |"
            echo "| **Linux** | [**Athanor-Linux-x64**](${telecharger}/Athanor-Linux-x64) | \`chmod +x Athanor-Linux-x64 && ./Athanor-Linux-x64\`. An ARM PC: [Athanor-Linux-ARM64](${telecharger}/Athanor-Linux-ARM64) |"
            echo
            echo "At its first launch, Athanor asks before creating its folder, then opens. **Updating:** Athanor looks for a new version when it opens: *Update now* at the top of its window (or *Settings → Options → Version*). Running pilots go on."
            echo
            echo "First launch: see the [Quick start](${depot}#quick-start) ([en français](${depot}/blob/main/README.fr.md#démarrage-rapide)). Checksums: \`SHA256SUMS.txt\`."
          } > release.md

      - uses: softprops/action-gh-release@v2
        with:
          name: Athanor ${{ env.VERSION }}
          generate_release_notes: true
          body_path: release.md
          files: |
            publie/Athanor-Windows-x64.exe
            publie/Athanor-Windows-ARM64.exe
            publie/Athanor-macOS.zip
            publie/Athanor-Linux-x64
            publie/Athanor-Linux-ARM64
            publie/SHA256SUMS.txt

  cancel:
    # a check, the build, the Mac's signature or the publishing failed (or the run was cancelled): no version
    # stays behind, neither the release nor its tag
    needs: [checks, build, mac, publish]
    if: ${{ failure() || cancelled() }}
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Remove the release and the tag
        run: |
          tag="${GITHUB_REF_NAME}"
          if gh release view "$tag" -R "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            gh release delete "$tag" -R "$GITHUB_REPOSITORY" --cleanup-tag --yes
          fi
          gh api -X DELETE "repos/${GITHUB_REPOSITORY}/git/refs/tags/${tag}" > /dev/null 2>&1 || true
          echo "::error title=Release cancelled::${tag} was not published: a check failed. Fix it, commit, then push the tag again (git tag -f ${tag} && git push origin ${tag})."
